name: StayHub CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  client-ci:
    name: Client Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  server-ci:
    name: Server Tests & API Smoke Check
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run check

      - name: Run unit & schema validation tests
        run: npm test

      - name: Seed database and verify health + hotels API
        env:
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/stayhub_ci
          JWT_SECRET: ci_pipeline_jwt_secret_key_for_verification
          JWT_EXPIRES_IN: 1d
          CLIENT_ORIGIN: http://localhost:5173
        run: |
          npm run seed
          node server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:5000/api/health; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:5000/api/hotels | grep -q "The Taj Mahal Palace"

  docker-ci:
    name: Docker Compose Image Build
    runs-on: ubuntu-latest
    needs: [client-ci, server-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config -q

      - name: Build Docker images
        run: docker compose build

